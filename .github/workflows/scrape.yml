name: Update scouting reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**', 'api/publish.js', 'scraper/cloud.mjs', 'scripts/**', 'tests/**', '.github/workflows/scrape.yml', 'config.json', 'vercel.json']
  schedule:
    # UTC. Explicit minute lists preserve the original five-minute playing windows.
    # The reader also enforces the 2026 tournament date window and free-account quota.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 8-11 6 11 *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 20-23 6 11 *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 0-11 7 11 *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 20-23 7 11 *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 0-10 8 11 *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: scouting-publish
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install reviewed dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify parser, reporting and publishing safeguards
        run: |
          node scripts/patch-ui.mjs
          node --test tests/*.test.mjs
      - name: Collect and publish scouting data
        env:
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
        run: node scraper/cloud.mjs
