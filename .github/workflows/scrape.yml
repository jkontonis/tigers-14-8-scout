name: Update scouting reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**', 'api/publish.js', 'scraper/**', 'scripts/**', 'tests/**', '.github/workflows/scrape.yml', 'config.json', 'vercel.json']
  schedule:
    # Backup for the self-dispatched tournament checks. Reader enforces dates.
    - cron: '17 * 6-8 11 *'
permissions:
  contents: read
  id-token: write
  actions: write
concurrency:
  group: scouting-publish
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install reviewed dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify parser, reporting and publishing safeguards
        id: verify
        run: |
          node scripts/repair-collection.mjs
          node scripts/patch-ui.mjs
          node --test tests/*.test.mjs
      - name: Collect and publish scouting data
        id: collect
        continue-on-error: true
        run: node scraper/public.mjs
      - name: Schedule bounded tournament successor
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scraper/continue.mjs
      - name: Report collection failure
        if: ${{ steps.collect.outcome == 'failure' }}
        run: exit 1
