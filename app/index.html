.coach .num { background: var(--ink); color: var(--gold); font-size: 15px; letter-spacing: .05em; padding: 12px 0; }

.steps { counter-reset: s; display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 12px 54px; position: relative; }
.steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 12px; top: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 18px; display: grid; place-items: center; }
.steps b { font-family: var(--display); font-size: 19px; font-weight: 800; display: block; line-height: 1.1; margin-bottom: 2px; }
.cues { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
.cue { background: var(--ink); color: var(--gold); font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .04em; padding: 6px 12px; border-radius: 8px; }
.motto { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.05; text-align: center; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

.foot { margin-top: 34px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }
@media (min-width: 600px) { .quick { grid-template-columns: repeat(3, 1fr); } }
</style>
